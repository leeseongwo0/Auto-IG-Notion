function calendar(){const first=new Date(Date.UTC(state.year,state.month,1)).getUTCDay(),days=new Date(Date.UTC(state.year,state.month+1,0)).getUTCDate(),weeks=Math.ceil((first+days)/7);let cells='';for(let i=0;i<weeks*7;i++){const day=i-first+1,inside=day>0&&day<=days,date=state.year+'-'+String(state.month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),events=inside?content.filter(c=>c.date===date):[];cells+='<div class="calendar-day '+(!inside?'outside':'')+'">'+(inside?'<span class="calendar-number '+(date==='2026-11-09'?'today':'')+'">'+day+'</span>':'')+events.map(c=>'<button class="calendar-event '+c.type+'" data-detail="'+c.id+'" aria-label="'+c.date+' '+c.name+' 상세"><span>'+c.name+'</span><small>'+(c.type==='reel'?'릴스':'게시물')+' · 조회 '+num(c.views)+'</small></button>').join('')+'</div>'}return '<section class="panel calendar-panel"><div class="calendar-head"><div class="calendar-controls"><button class="iconbutton" id="prev-month" aria-label="이전 달">'+icon('chevronleft')+'</button><span id="calendar-month">'+state.year+'년 '+(state.month+1)+'월</span><button class="iconbutton" id="next-month" aria-label="다음 달">'+icon('chevronright')+'</button></div>'+viewToggle()+'</div><div class="calendar-grid">'+['일','월','화','수','목','금','토'].map(d=>'<div class="calendar-dow">'+d+'</div>').join('')+cells+'</div><div class="table-footer"><span>게시일 기준 캘린더 · 콘텐츠를 누르면 누적 성과를 확인할 수 있어요.</span><span>가상 기준일 2026.11.09</span></div></section>'}
function viewToggle(){return '<div class="view-toggle" aria-label="콘텐츠 보기"><button data-view="calendar" class="'+(state.view==='calendar'?'active':'')+'">캘린더</button><button data-view="list" class="'+(state.view==='list'?'active':'')+'">목록</button></div>'}
function contentPage(){return state.view==='calendar'?calendar():'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'+viewToggle()+'</div>'+table()}
function accountPage(){const follower=state.accountMetric==='followers';return stats()+'<div class="account-note"><b>같은 숫자도, 기준은 다르게.</b> 팔로워는 해당 날짜의 관측값, 조회·저장은 하루에 발생한 값입니다. 도달은 기간 내 고유 계정 수이므로 날짜별 값을 합산하지 않습니다.</div><section class="panel account-chart"><div class="panel-head"><div><h2 class="panel-title">'+(follower?'팔로워':'일별 조회')+' 변화</h2><p class="panel-sub">'+dateRange()+' · 샘플 시계열</p></div><div class="account-chart-tabs"><button data-account-metric="views" class="'+(!follower?'active':'')+'">조회</button><button data-account-metric="followers" class="'+(follower?'active':'')+'">팔로워</button></div></div><div class="chart-wrap">'+chart(selected().map(d=>follower?d.followers:d.views),{follower})+'</div></section><section class="panel table-panel"><div class="table-top"><h2>날짜별 관측 기록</h2><span class="reels-label">최근 '+state.days+'일 · KST</span></div><div class="table-scroll"><table><thead><tr><th>기준일</th><th>팔로워 · 시점값</th><th>조회 · 일별</th><th>저장 · 일별</th><th>데이터</th></tr></thead><tbody>'+selected().slice().reverse().map(d=>'<tr><td>'+d.date.replaceAll('-','.')+'</td><td>'+num(d.followers)+'</td><td>'+num(d.views)+'</td><td>'+num(d.saves)+'</td><td><span class="status-pill">샘플</span></td></tr>').join('')+'</tbody></table></div></section>'}
function logsPage(){return '<section class="log-status"><div><h2 id="simulation-heading">'+(state.simulating?'샘플 수집 흐름을 재생하고 있어요.':'자동화가 어떻게 움직이는지 살펴보세요.')+'</h2><p id="simulation-copy">'+(state.simulating?'실제 계정에 접속하거나 Notion에 기록하지 않습니다.':'연결과 예약은 아직 설정되지 않았어요. 아래 기록은 모두 가상 예시입니다.')+'</p>'+(state.simulating?'<div class="simulation-progress"><div id="simulation-bar" style="width:'+state.progress+'%"></div></div>':'')+'</div><span class="status-pill '+(state.simulating?'running':'')+'">'+(state.simulating?'시뮬레이션 중':'실제 예약 미설정')+'</span></section><section class="panel"><div class="panel-head" style="padding-bottom:15px"><div><h2 class="panel-title">수집 타임라인</h2><p class="panel-sub">새 기록 · 기존 기록 갱신 · 확인 필요 항목</p></div><span class="reels-label">모든 실행은 데모</span></div><div id="log-list">'+state.logs.map(l=>'<article class="log-row"><div class="log-icon">'+icon(l.partial?'clock':'check')+'</div><div class="log-copy"><div class="log-title">'+l.title+' <span class="status-pill '+(l.partial?'partial':'')+'">'+l.status+'</span></div><p>'+l.detail+'</p></div><time class="log-time">'+l.time+'</time></article>').join('')+'</div></section>'}
function footer(){return '<footer class="page-footer"><span><b>인사이트 노트</b> &nbsp; 콘텐츠의 기록이 다음 아이디어가 되도록.</span><span class="status">모든 수치는 가상 데이터입니다.</span></footer>'}
function render(){document.getElementById('main').innerHTML=header()+({overview,content:contentPage,account:accountPage,logs:logsPage}[state.page])()+footer();document.getElementById('breadcrumb-current').textContent=titles[state.page];document.querySelectorAll('.nav [data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});bindInputs()}
function bindInputs(){document.getElementById('date-range')?.addEventListener('change',e=>{state.days=Number(e.target.value);render()});document.getElementById('content-search')?.addEventListener('input',e=>{state.query=e.target.value;refreshRows()});document.getElementById('content-sort')?.addEventListener('change',e=>{state.sort=e.target.value;refreshRows()})}
function refreshRows(){document.getElementById('content-rows').innerHTML=rows(state.page==='overview'?4:99);document.getElementById('result-count').textContent=(state.page==='overview'?'상위 '+Math.min(filtered().length,4):filtered().length)+'개 콘텐츠 · 누적값은 기간 요약과 다릅니다.'}
function openDetail(id){const c=content.find(d=>d.id===id),dialog=document.getElementById('detail-dialog');const vals=['조회','도달','좋아요','댓글','저장','공유'],metrics=[c.views,c.reach,c.likes,c.comments,c.saves,c.shares];const lifetime=(c.views||c.reach);const publishedAt=new Date(c.date+'T06:00:00+09:00');const observedAt=new Date('2026-11-09T09:00:00+09:00');const sameDay=c.date==='2026-11-09';const observationLabels=Array.from({length:6},(_,i)=>{const instant=new Date(publishedAt.getTime()+(observedAt-publishedAt)*i/5);const kst=new Date(instant.getTime()+9*60*60*1000).toISOString();return sameDay?kst.slice(11,16):kst.slice(5,10).replace('-','.');});dialog.innerHTML='<div class="dialog-top"><div class="dialog-art">'+art(c.theme)+'</div><div class="dialog-heading"><div class="eyebrow">'+(c.type==='reel'?'REEL INSIGHT':'POST INSIGHT')+' · 샘플</div><h2 id="detail-title">'+c.name+'</h2><p>게시 시각 '+c.date.replaceAll('-','.')+' 06:00 KST · '+c.subtitle+'</p><p>관측 시각 2026.11.09 09:00 KST</p></div><button class="dialog-close" aria-label="상세 닫기">×</button></div><div class="dialog-body"><div class="detail-stats">'+vals.map((v,i)=>'<div class="detail-stat"><span>'+v+' · 누적</span><strong>'+num(metrics[i])+'</strong></div>').join('')+'</div><div class="detail-note">'+(c.views===null?'이 샘플의 조회수는 원본 미제공 상황을 표현합니다. 빈값을 0으로 바꾸지 않고 누락 사유를 함께 남깁니다.':'게시일과 관측일은 다릅니다. 위 수치는 관측 시점까지의 누적값이며, 선택 기간에 발생한 수치가 아닙니다.')+'</div><h3 class="detail-heading">누적 '+(c.views===null?'도달':'조회')+' 변화 · 가상 관측 예시</h3>'+chart([0,.21,.43,.62,.83,1].map(n=>Math.round(lifetime*n)),{small:true,labels:observationLabels,accessibleName:'게시 이후의 가상 누적 '+(c.views===null?'도달':'조회')+' 추이'})+'<div class="detail-observation"><span>'+ (sameDay?'게시 당일 06:00–09:00 가상 관측 · KST':'게시 이후의 가상 관측 · 실제 이력 아님') +'</span><span>실제 게시물 링크 미연결</span></div></div>';dialog.querySelector('.dialog-close').addEventListener('click',()=>dialog.close());dialog.showModal()}
function simulate(){if(state.simulating)return;state.simulating=true;state.progress=0;render();toast('데모 수집을 시작했어요. 실제 데이터는 변경하지 않습니다.');const phases=[['대상 계정 확인 예시',25],['지표 읽기와 기간 검증 예시',55],['중복 확인과 Notion 저장 검증 예시',85]];phases.forEach(([label,p],i)=>setTimeout(()=>{state.progress=p;if(state.page==='logs'){document.getElementById('simulation-heading').textContent=label;document.getElementById('simulation-bar').style.width=p+'%'}},700*(i+1)));setTimeout(()=>{state.simulating=false;state.progress=100;state.logs.unshift({time:'방금 · 데모',title:'수집 시뮬레이션 완료',detail:'샘플 콘텐츠 8개 확인 · 기록 갱신 8개 · 새 중복 0개 · 미제공 지표 1건',status:'부분 수집',partial:true});render();toast('시뮬레이션 완료 · 수집 기록에서 결과를 확인하세요.');},3000)}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.page){state.page=target.dataset.page;state.query='';state.type='all';render();window.scrollTo({top:0,behavior:'instant'})}else if(target.dataset.type){state.type=target.dataset.type;render()}else if(target.dataset.view){state.view=target.dataset.view;render()}else if(target.dataset.detail){openDetail(Number(target.dataset.detail))}else if(target.dataset.accountMetric){state.accountMetric=target.dataset.accountMetric;render()}else if(target.hasAttribute('data-simulate'))simulate();else if(target.id==='prev-month'||target.id==='next-month'){const d=new Date(Date.UTC(state.year,state.month+(target.id==='prev-month'?-1:1),1));state.month=d.getUTCMonth();state.year=d.getUTCFullYear();render()}});
document.getElementById('detail-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
render();
</script>
</body>
</html>
